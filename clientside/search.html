<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — Search Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-nav" id="site-nav">
    <div class="site-nav__inner">
      <a class="site-nav__logo" href="index.html">PingXiang Charity</a>
      <button class="site-nav__pill" id="nav-toggle" type="button">Navigate</button>
      <span class="site-nav__flower" id="nav-flower"></span>
      <button class="site-nav__burger" id="burger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="overlay">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay">
    <a href="index.html">Home</a>
    <a href="search.html">Search Events</a>
  </div>

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Find your cause</p>
      <h1 class="display page-hero__title">Search charity<br class="hero__br"> events</h1>
      <p class="page-hero__sub">Filter by date, location, or category.</p>
    </div>
  </section>

  <section class="search-section">
    <form id="search-form" class="search-form" novalidate>
      <div class="search-form__grid">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="e.g. Melbourne">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="">All categories</option>
          </select>
          <span class="field__chevron" id="category-chevron"></span>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--solid" id="search-btn">Search</button>
        <button type="button" id="clear-btn" class="btn btn--outline">Clear filters</button>
      </div>
      <p id="error" class="form-error" role="alert"></p>
    </form>
  </section>

  <section class="results">
    <div class="results-head">
      <p class="eyebrow">Results</p>
      <h2 class="display" id="results-title">Matching events</h2>
    </div>
    <div id="results" class="grid" aria-live="polite"></div>
  </section>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="site-footer__brand">PingXiang Charity</span>
      <span class="site-footer__copy">&copy; 2026 PingXiang Charity</span>
      <nav class="site-footer__links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
      </nav>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/search.js"></script>
  <script>
    document.getElementById('category-chevron').innerHTML = window.ICO.chevronDown(16);
  </script>
</body>
</html>
