<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingXiang Charity — Event Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-nav" id="site-nav">
    <div class="site-nav__inner">
      <a class="site-nav__logo" href="index.html">PingXiang Charity</a>
      <button class="site-nav__pill" id="nav-toggle" type="button">Navigate</button>
      <span class="site-nav__flower" id="nav-flower"></span>
      <button class="site-nav__burger" id="burger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="overlay">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay">
    <a href="index.html">Home</a>
    <a href="search.html">Search Events</a>
  </div>

  <main class="detail-main">
    <article class="detail-article">
      <div id="event-detail"></div>
    </article>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__content">
      <button class="modal__close" id="modal-close" type="button" aria-label="Close"></button>
      <p class="eyebrow">Coming soon</p>
      <h3 class="modal__title" id="modal-title">This feature is currently under construction.</h3>
      <p class="modal__body">Ticket registration will be available in the next release. Please check back soon.</p>
      <button class="btn btn--solid" id="modal-close-btn" type="button">Close</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="site-footer__brand">PingXiang Charity</span>
      <span class="site-footer__copy">&copy; 2026 PingXiang Charity</span>
      <nav class="site-footer__links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
      </nav>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/event.js"></script>
  <script>
    document.getElementById('modal-close').innerHTML = window.ICO.x(20);
  </script>
</body>
</html>
